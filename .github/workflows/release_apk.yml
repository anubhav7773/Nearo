name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Flutter APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display Build Environment Info
        run: |
          flutter --version
          java -version

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release --split-per-abi=false

      - name: Generate Build Metadata
        id: meta
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "TIMESTAMP=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.TIMESTAMP }}-${{ steps.meta.outputs.SHA_SHORT }}
          name: "Nearo Android Release (${{ steps.meta.outputs.TIMESTAMP }})"
          body: |
            ### 🚀 Nearo Automated Android Build
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Parent Entity:** ASIVERTICALS
            - **Build Timestamp:** ${{ steps.meta.outputs.TIMESTAMP }}

            📲 **Download:** Direct `app-release.apk` is attached below.
          draft: false
          prerelease: false
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
